<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Gejala — Heal.In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/auth.js"></script>
<script>
  // Gerbang: halaman ini wajib login. Kalau belum, lempar ke sign-in.html
  // dan bawa balik ke sini setelah berhasil masuk.
  healinRequireAuth();
</script>

<nav class="navbar navbar-healin">
  <div class="container">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24"><path fill="#2f6140" d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2 4.5 5.4 3.7c2-.5 4 .3 5.1 2 .9-1.7 2.9-2.5 5-2 3.4.8 5 4.4 3.4 8C19.5 16.4 12 21 12 21z"/></svg>
      Heal.In
    </a>
    <a href="index.html" class="btn-healin-outline">Batalkan</a>
  </div>
</nav>

<main class="section-tight">
  <div class="container" style="max-width: 720px;">

    <p class="eyebrow mb-2">Formulir Skrining</p>
    <h1 class="display h3 mb-1">Gejala apa yang kamu rasakan belakangan ini?</h1>
    <p class="text-muted mb-4">Centang seluruh gejala yang sesuai. Tidak apa-apa kalau ada beberapa sekaligus — jawab sejujur mungkin.</p>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small fw-semibold" id="stepLabel">Langkah 1 dari 4 · Gejala Fisik</span>
      <span class="small text-muted" id="stepPercent">25%</span>
    </div>
    <div class="progress-healin mb-4"><div class="bar" id="progressBar" style="width:25%"></div></div>

    <form id="gejalaForm">

      <!-- STEP 1: FISIK -->
      <div class="step-panel active" data-step="1">
        <h2 class="h6 mb-3">Gejala Fisik</h2>
        <div class="d-grid gap-2">
          <div class="gejala-option"><input type="checkbox" name="gejala" value="sulit_tidur" id="g1"><label for="g1">Sulit tidur</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="mudah_lelah" id="g2"><label for="g2">Mudah lelah</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="sakit_kepala" id="g3"><label for="g3">Sakit kepala berulang</label></div>
        </div>
      </div>

      <!-- STEP 2: KOGNITIF -->
      <div class="step-panel" data-step="2">
        <h2 class="h6 mb-3">Gejala Kognitif</h2>
        <div class="d-grid gap-2">
          <div class="gejala-option"><input type="checkbox" name="gejala" value="sulit_konsentrasi" id="g4"><label for="g4">Sulit berkonsentrasi</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="mudah_lupa" id="g5"><label for="g5">Mudah lupa</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="pikiran_negatif" id="g6"><label for="g6">Pikiran negatif berulang</label></div>
        </div>
      </div>

      <!-- STEP 3: EMOSIONAL -->
      <div class="step-panel" data-step="3">
        <h2 class="h6 mb-3">Gejala Emosional</h2>
        <div class="d-grid gap-2">
          <div class="gejala-option"><input type="checkbox" name="gejala" value="cemas_berlebihan" id="g7"><label for="g7">Cemas berlebihan</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="mudah_marah" id="g8"><label for="g8">Mudah marah</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="sedih_berkepanjangan" id="g9"><label for="g9">Merasa sedih berkepanjangan</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="putus_asa" id="g10"><label for="g10">Merasa putus asa</label></div>
        </div>
      </div>

      <!-- STEP 4: PERILAKU -->
      <div class="step-panel" data-step="4">
        <h2 class="h6 mb-3">Gejala Perilaku</h2>
        <div class="d-grid gap-2">
          <div class="gejala-option"><input type="checkbox" name="gejala" value="kehilangan_motivasi" id="g11"><label for="g11">Kehilangan motivasi belajar</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="menarik_diri" id="g12"><label for="g12">Menarik diri dari lingkungan sosial</label></div>
          <div class="gejala-option"><input type="checkbox" name="gejala" value="penurunan_produktivitas" id="g13"><label for="g13">Penurunan produktivitas</label></div>
        </div>
      </div>

      <div id="errorBox" class="alert alert-danger d-none mt-3"></div>

      <div class="d-flex justify-content-between mt-4">
        <button type="button" class="btn-healin-outline" id="btnBack" disabled>Kembali</button>
        <button type="button" class="btn-healin" id="btnNext">Lanjut</button>
        <button type="submit" class="btn-healin d-none" id="btnSubmit">Lihat Hasil</button>
      </div>
    </form>

  </div>
</main>

<script src="js/api.js"></script>
<script src="js/questionnaire.js"></script>
</body>
</html>
