<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Heal.In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-healin">
  <div class="container">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24"><path fill="#2f6140" d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2 4.5 5.4 3.7c2-.5 4 .3 5.1 2 .9-1.7 2.9-2.5 5-2 3.4.8 5 4.4 3.4 8C19.5 16.4 12 21 12 21z"/></svg>
      Heal.In
    </a>
    <a href="index.html" class="btn-healin-outline">Batalkan</a>
  </div>
</nav>

<main class="section-tight">
  <div class="container" style="max-width: 440px;">

    <p class="eyebrow mb-2 text-center">Selamat Datang Kembali</p>
    <h1 class="display h3 mb-1 text-center">Masuk ke Heal.In</h1>
    <p class="text-muted mb-4 text-center" id="introText">Masuk untuk melanjutkan ke formulir skrining.</p>

    <form id="signInForm" class="card-healin" novalidate>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">Email</label>
        <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold small">Kata sandi</label>
        <input type="password" class="form-control" id="password" placeholder="Kata sandi kamu" required>
      </div>

      <div id="errorBox" class="alert alert-danger d-none py-2 small"></div>

      <button type="submit" class="btn-healin w-100 mt-2">Masuk</button>

      <p class="text-center small text-muted mt-3 mb-0">
        Belum punya akun? <a href="sign-up.html" style="color:var(--hijau-700); font-weight:600;">Daftar di sini</a>
      </p>
    </form>

  </div>
</main>

<script src="js/auth.js"></script>
<script>
  // Kalau datang dari gerbang questionnaire.html, sesuaikan pesan & tujuan redirect
  const redirectTarget = healinGetRedirectParam();
  if (redirectTarget !== "index.html") {
    document.getElementById("introText").textContent =
      "Masuk dulu untuk melanjutkan ke formulir skrining.";
  }

  const form = document.getElementById("signInForm");
  const errorBox = document.getElementById("errorBox");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("d-none");
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorBox.classList.add("d-none");

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showError("Mohon isi email dan kata sandi.");
      return;
    }

    const users = healinGetUsers();
    const user = users.find((u) => u.email === email && u.password === password);

    if (!user) {
      showError("Email atau kata sandi salah. Periksa lagi, atau daftar dulu kalau belum punya akun.");
      return;
    }

    healinSetSession(user);
    window.location.href = redirectTarget;
  });
</script>
</body>
</html>
